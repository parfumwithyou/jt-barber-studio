<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JT Barber Studio - Control de Caja</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #f5f5f5; padding: 15px; max-width: 480px; margin: 0 auto; pb: 30px; }
    
    /* Header */
    .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #d4af37; padding-bottom: 12px; }
    .header h1 { color: #d4af37; margin: 0; font-size: 1.7rem; letter-spacing: 1px; text-transform: uppercase; }
    .fecha-badge { background: #1e1e1e; color: #aaa; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-top: 8px; border: 1px solid #333; }

    /* Cards */
    .section-card { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #2a2a2a; margin-bottom: 15px; }
    .section-title { font-size: 0.9rem; text-transform: uppercase; color: #d4af37; letter-spacing: 1px; margin: 0 0 10px 0; font-weight: bold; }

    /* Grid de Botones */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .btn-quick { background: #262626; color: #fff; border: 1px solid #3a3a3a; padding: 12px 6px; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; font-size: 0.85rem; transition: background 0.1s; }
    .btn-quick:active { background: #d4af37; color: #000; }
    .btn-quick .price { display: block; color: #28a745; font-size: 0.95rem; margin-top: 3px; font-weight: bold; }
    
    .btn-decant { border-color: #5b3a29; }
    .btn-decant .price { color: #e5a93c; }

    /* Custom Form */
    .custom-group { display: flex; gap: 6px; margin-top: 5px; }
    input[type="text"], input[type="number"] { background: #262626; border: 1px solid #3a3a3a; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.85rem; }
    input[type="text"] { flex: 2; }
    input[type="number"] { flex: 1; text-align: right; }
    .btn-add { background: #28a745; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* History List */
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #262626; }
    .history-item:last-child { border-bottom: none; }
    .item-info { font-size: 0.9rem; }
    .item-time { font-size: 0.75rem; color: #777; }
    .item-amount { font-weight: bold; color: #28a745; margin-right: 8px; }
    .btn-del { background: #dc3545; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }

    /* Total Bar */
    .total-bar { position: sticky; bottom: 10px; background: #1a1a1a; border: 2px solid #d4af37; padding: 12px 15px; border-radius: 12px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.8); z-index: 100; }
    .total-title { font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .total-val { font-size: 1.8rem; font-weight: bold; color: #d4af37; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>JT Barber Studio</h1>
    <div class="fecha-badge" id="fecha-label">Cargando fecha...</div>
  </div>

  <!-- Servicios de Cortes -->
  <div class="section-card">
    <div class="section-title">Servicios Barbería</div>
    <div class="grid-2">
      <button class="btn-quick" onclick="registrar('Corte Simple', 250)">
        Corte Simple <span class="price">$250</span>
      </button>
      <button class="btn-quick" onclick="registrar('Corte Clásico Tijera', 300)">
        Clásico Tijera <span class="price">$300</span>
      </button>
      <button class="btn-quick" onclick="registrar('Corte Moderno', 400)">
        Corte Moderno <span class="price">$400</span>
      </button>
      <button class="btn-quick" onclick="registrar('Solo Barba', 150)">
        Solo Barba <span class="price">$150</span>
      </button>
    </div>
    <div style="margin-top: 8px;">
      <button class="btn-quick" style="width: 100%; border-color: #d4af37;" onclick="registrar('Corte + Barba', 450)">
        Corte + Barba <span class="price" style="color: #d4af37;">$450</span>
      </button>
    </div>
  </div>

  <!-- Venta de Decants -->
  <div class="section-card">
    <div class="section-title">Decants de Perfumes</div>
    <div class="grid-3">
      <button class="btn-quick btn-decant" onclick="registrar('Decant $300', 300)">
        Decant <span class="price">$300</span>
      </button>
      <button class="btn-quick btn-decant" onclick="registrar('Decant $500', 500)">
        Decant <span class="price">$500</span>
      </button>
      <button class="btn-quick btn-decant" onclick="registrar('Decant $700', 700)">
        Decant <span class="price">$700</span>
      </button>
    </div>
  </div>

  <!-- Servicio o Promo Personalizada -->
  <div class="section-card">
    <div class="section-title">Promo / Valor Especial</div>
    <div class="custom-group">
      <input type="text" id="custom-nombre" placeholder="Ej: Promo 2x1 / Producto">
      <input type="number" id="custom-precio" placeholder="$">
      <button class="btn-add" onclick="registrarCustom()">+</button>
    </div>
  </div>

  <!-- Historial Diario -->
  <div class="section-card">
    <div class="section-title">Atenciones del Día</div>
    <div id="lista-historial">
      <p style="color: #666; font-size: 0.85rem; text-align: center;">Sin registros hoy aún.</p>
    </div>
  </div>

  <!-- Total Sticky -->
  <div class="total-bar">
    <div class="total-title" id="total-subtitulo">Ganancia de Hoy</div>
    <div class="total-val" id="total-monto">$0</div>
  </div>

  <script>
    // Configuración de Fechas
    const ahora = new Date();
    const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long' };
    const fechaHumana = ahora.toLocaleDateString('es-ES', opcionesFecha);
    
    // Identificador único para guardar por fecha (Ej: "2026-10-16")
    const claveDia = ahora.toISOString().split('T')[0];

    document.getElementById("fecha-label").innerText = fechaHumana.charAt(0).toUpperCase() + fechaHumana.slice(1);

    // Cargar datos de localStorage del celular
    let atenciones = JSON.parse(localStorage.getItem(`jt_barber_${claveDia}`)) || [];

    function renderizar() {
      const contenedor = document.getElementById("lista-historial");
      let total = 0;

      if (atenciones.length === 0) {
        contenedor.innerHTML = `<p style="color: #666; font-size: 0.85rem; text-align: center;">Sin registros hoy aún.</p>`;
      } else {
        contenedor.innerHTML = "";
        atenciones.forEach((item, index) => {
          total += item.monto;
          const div = document.createElement("div");
          div.className = "history-item";
          div.innerHTML = `
            <div>
              <div class="item-info"><strong>${item.concepto}</strong></div>
              <div class="item-time">${item.hora}</div>
            </div>
            <div>
              <span class="item-amount">+$${item.monto}</span>
              <button class="btn-del" onclick="eliminar(${index})">✕</button>
            </div>
          `;
          contenedor.appendChild(div);
        });
      }

      document.getElementById("total-monto").innerText = `$${total}`;
      
      // Guardar en la memoria local
      localStorage.setItem(`jt_barber_${claveDia}`, JSON.stringify(atenciones));
    }

    function registrar(concepto, monto) {
      const horaStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      atenciones.push({
        concepto: concepto,
        monto: parseFloat(monto),
        hora: horaStr
      });
      renderizar();
    }

    function registrarCustom() {
      const nomInput = document.getElementById("custom-nombre");
      const preInput = document.getElementById("custom-precio");

      const nombre = nomInput.value.trim() || "Servicio Especial";
      const precio = parseFloat(preInput.value);

      if (isNaN(precio) || precio <= 0) {
        alert("Por favor ingresa un monto válido.");
        return;
      }

      registrar(nombre, precio);

      nomInput.value = "";
      preInput.value = "";
    }

    function eliminar(index) {
      if(confirm(`¿Borrar este registro?`)) {
        atenciones.splice(index, 1);
        renderizar();
      }
    }

    // Inicializar
    renderizar();
  </script>
</body>
</html>
